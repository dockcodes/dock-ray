[project]
name = "dock-thor-client"
version = "1.2.0"
description = "Python client for DockTHOR error and performance monitoring"
authors = [{ name = "Jacek Labudda", email = "j.labudda@dock.codes" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["error reporting", "monitoring", "async", "asgi", "fastapi", "logging"]
dependencies = ["httpx>=0.28.1"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
]

[project.urls]
Homepage = "https://dock.codes"
Source = "https://github.com/dockcodes/dock-thor"
Issues = "https://github.com/dockcodes/dock-thor/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dock_thor"]
